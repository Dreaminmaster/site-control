name: Site Control Hub checks
on:
  pull_request:
    paths:
      - "hub/**"
      - ".github/workflows/hub-check.yml"
  push:
    branches: [feature/site-control-hub-v2]
permissions:
  contents: read
jobs:
  core-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - name: Record generated public dependency lock for review
        run: |
          node --input-type=module -e 'import{readFileSync}from"node:fs";const s=JSON.stringify(JSON.parse(readFileSync("package-lock.json","utf8")));const a=s.match(/.{1,1500}/gs)||[];for(let i=0;i<a.length;i++)console.log("SC_LOCK:"+i+":"+a[i]);console.log("SC_LOCK_COUNT:"+a.length);'
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run check
      - run: npx wrangler d1 migrations apply DB --local
        env:
          CI: "true"
      - run: node test/runtime-smoke.mjs
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"
      - run: npx wrangler d1 migrations apply FIXTURE_DB --local --config wrangler.fixture.jsonc
        env:
          CI: "true"
      - run: npx wrangler deploy --dry-run --config wrangler.fixture.jsonc --outdir dist-fixture
        env:
          CI: "true"
